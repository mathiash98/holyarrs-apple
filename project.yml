name: HolyArrs
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    visionOS: "26.0"
    tvOS: "26.0"
    iOS: "26.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
targets:
  HolyArrs:
    type: application
    supportedDestinations: [visionOS, tvOS, iOS]
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: HolyArrs
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HOLYARRS_BUNDLE_ID)
        PRODUCT_NAME: HolyArrs
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletv*]": "App Icon & Top Shelf Image"
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=iphone*]": AppIcon-iOS
        TARGETED_DEVICE_FAMILY: "1,2,3,7"
    info:
      path: HolyArrs/Info.plist
      properties:
        CFBundleDisplayName: HolyArrs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.entertainment
        LSApplicationQueriesSchemes: [swiftfin, youtube]
        UILaunchScreen: {}
        # Immersive spaces (the visionOS cinema theatre) need multiple scenes.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
          UISceneConfigurations: {}
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
